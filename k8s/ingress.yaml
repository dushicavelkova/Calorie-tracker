apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calorie-tracker-ingress
  namespace: calorie-tracker
spec:
  ingressClassName: traefik
  rules:
  - host: calorie-tracker.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80