<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie & Diet Tracker</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px 20px;
    background: #f6f8f6;
    color: #252525;
}

/* MAIN CONTAINER */
.container {
    max-width: 620px;
    margin: auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
}

/* TITLE */
h2 {
    text-align: center;
    margin: 0 0 28px;
    font-size: 28px;
    color: #222;
}

h3 {
    margin-top: 32px;
    margin-bottom: 14px;
    font-size: 20px;
    color: #292929;
}

/* INPUTS AND SELECTS */
input,
select {
    width: 100%;
    padding: 12px 14px;
    margin: 7px 0;
    border-radius: 10px;
    border: 1px solid #dfe3df;
    background: #fafbfa;
    color: #333;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus,
select:focus {
    border-color: #63b777;
    box-shadow: 0 0 0 3px rgba(99, 183, 119, 0.12);
    background: #ffffff;
}

/* ADD MEAL BUTTON */
.add-button {
    width: 100%;
    padding: 12px 14px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
}

/* ALL BUTTONS */
button {
    background-color: #63b777;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
}

button:hover {
    background-color: #4fa666;
    transform: translateY(-1px);
}

/* FILTER BUTTONS */
.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.filters button {
    background: #f0f3f0;
    color: #555;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.filters button:hover {
    background: #dfeee2;
    color: #3f8d51;
    transform: none;
}

/* MEAL LIST */
ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
}

/* MEAL CARD */
li {
    background: #fafbfa;
    margin: 12px 0;
    padding: 18px;
    border: 1px solid #e7ebe7;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s ease;
}

li:hover {
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
    transform: translateY(-1px);
}

/* MEAL INFORMATION */
.meal-info {
    flex: 1;
    min-width: 0;
}

.meal-top {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
}

.meal-name {
    font-size: 16px;
    font-weight: 700;
    color: #252525;
}

/* BREAKFAST / LUNCH / DINNER / SNACK */
.meal-type {
    font-size: 10px;
    font-weight: 700;
    color: #4d9560;
    background: #e8f4eb;
    padding: 4px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* QUANTITY + CALORIES */
.meal-details {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.meal-quantity {
    font-size: 13px;
    color: #777;
}

.meal-calories {
    font-size: 14px;
    font-weight: 700;
    color: #333;
}

/* MACROS */
.meal-macros {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: #858585;
}

.meal-macros strong {
    color: #4f5d52;
    font-weight: 700;
}

/* EDIT + DELETE AREA */
.actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

/* EDIT BUTTON */
.edit-button {
    width: auto !important;
    min-width: 58px;
    padding: 7px 10px !important;
    margin: 0 !important;
    border-radius: 7px;
    font-size: 11px !important;
    background: #eef2ef;
    color: #4c6653;
}

.edit-button:hover {
    background: #dfe8e1;
    color: #35543d;
}

/* DELETE BUTTON */
.delete-button {
    width: auto !important;
    min-width: 58px;
    padding: 7px 10px !important;
    margin: 0 !important;
    border-radius: 7px;
    font-size: 11px !important;
    background: #f8e8e8;
    color: #b65353;
}

.delete-button:hover {
    background: #f3d8d8;
    color: #a43e3e;
}

/* TOTALS */
.total {
    font-weight: 600;
    text-align: right;
    margin-top: 14px;
    color: #333;
}

#total-calories {
    font-size: 18px;
    margin-top: 22px;
}

#total-macros {
    font-size: 13px;
    color: #777;
}

/* DAILY GOAL SECTION */
.daily-goal {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid #eeeeee;
}

.daily-goal p {
    font-size: 14px;
    color: #555;
}

/* GOAL INPUT */
#calorie-goal {
    width: 120px;
    display: inline-block;
    margin-left: 6px;
}

/* PROGRESS BAR */
.progress-bar {
    width: 100%;
    height: 12px;
    background: #e9ece9;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 12px;
}

#progress {
    width: 0%;
    height: 100%;
    background: #63b777;
    border-radius: 20px;
    transition: width 0.3s ease;
}

/* PERCENTAGE */
#percentage {
    text-align: center;
    font-weight: bold;
    color: #4d9560;
    margin-top: 8px;
}

/* MOBILE */
@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .container {
        padding: 22px 18px;
        border-radius: 14px;
    }

    h2 {
        font-size: 24px;
    }

    li {
        align-items: flex-start;
        padding: 14px;
    }

    .meal-top {
        flex-wrap: wrap;
    }

    .meal-macros {
        flex-wrap: wrap;
        gap: 8px 12px;
    }

    .actions {
        flex-direction: column;
    }

    .edit-button,
    .delete-button {
        min-width: 52px;
    }
}
</style>

</head>
<body>
    <div class="container">
        <h2>Calorie Tracker</h2>
        <form id="meal-form">
            <!-- <input type="text" id="food" placeholder="Food Name (e.g., Peanuts & Cheese)" required> -->
            <select id="food" required>
                <option value="">Select Food</option>
            </select>
            <input type="number" id="quantity" placeholder="Quantity" required>
            <select id="unit" required>
                <option value="">Select Unit</option>
                <option value="grams">Grams</option>
                <option value="pieces">Pieces</option>
            </select>
            <select id="meal-type" required>
                <option value="">Select Meal</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>
            <button type="submit" class="add-button">Add Meal</button>
        </form>
        <h3>Daily Meals</h3>
        <div class="filters">
            <button type="button" onclick="filterMeals('All')">All</button>
            <button type="button" onclick="filterMeals('Breakfast')">Breakfast</button>
            <button type="button" onclick="filterMeals('Lunch')">Lunch</button>
            <button type="button" onclick="filterMeals('Dinner')">Dinner</button>
            <button type="button" onclick="filterMeals('Snack')">Snack</button>
        </div>
        <ul id="meal-list"></ul>
        <div class="total" id="total-calories">Total Calories: 0 kcal</div>
        <div class="total" id="total-macros">
            Protein: 0g | Carbs: 0g | Fat: 0g
        </div>
        <div class="daily-goal">
            <p>Today's Calories: <span id="today-calories">0</span> kcal</p>

            <p>
                Goal:
                <input type="number" id="calorie-goal" placeholder="Enter goal">
                kcal
            </p>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <p id="percentage">0%</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
