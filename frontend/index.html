<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie & Diet Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .add-button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .delete-button, .edit-button { width: 60px !important; padding: 5px !important; margin: 0 !important; font-size: 12px !important; }
        button { background-color: #2ecc71; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background-color: #27ae60; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; display: flex; gap: 10px; }
        .total { font-weight: bold; text-align: right; margin-top: 15px; }
        .actions { margin-left: auto; display: flex; gap: 5px; }
        .daily-goal { margin-top: 20px;}
        .progress-bar { width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #2ecc71; }
        #percentage { text-align: center; font-weight: bold; }
        .meal-type { font-size: 13px; color: #666; }
        .meal-macros { display: inline; font-size: 14px; color: black; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calorie Tracker</h2>
        <form id="meal-form">
            <input type="text" id="food" placeholder="Food Name (e.g., Peanuts & Cheese)" required>
            <input type="number" id="calories" placeholder="Calories" required>
            <input type="number" id="protein" placeholder="Protein (g)" required>
            <input type="number" id="carbs" placeholder="Carbs (g)" required>
            <input type="number" id="fat" placeholder="Fat (g)" required>
            <select id="meal-type" required>
                <option value="">Select Meal</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>
            <button type="submit">Add Meal</button>
        </form>
        <h3>Daily Meals</h3>
        <div class="filters">
            <button type="button" onclick="filterMeals('All')">All</button>
            <button type="button" onclick="filterMeals('Breakfast')">Breakfast</button>
            <button type="button" onclick="filterMeals('Lunch')">Lunch</button>
            <button type="button" onclick="filterMeals('Dinner')">Dinner</button>
            <button type="button" onclick="filterMeals('Snack')">Snack</button>
        </div>
        <ul id="meal-list"></ul>
        <div class="total" id="total-calories">Total Calories: 0 kcal</div>
        <div class="total" id="total-macros">
            Protein: 0g | Carbs: 0g | Fat: 0g
        </div>
        <div class="daily-goal">
            <p>Today's Calories: <span id="today-calories">0</span> kcal</p>

            <p>
                Goal:
                <input type="number" id="calorie-goal" placeholder="Enter goal">
                kcal
            </p>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <p id="percentage">0%</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
